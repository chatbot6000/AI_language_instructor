<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · EVANGELINE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="page-center">
      <section class="card">
        <p style="margin: 0 0 0.25rem; font-family: var(--font-display); color: var(--teal-deep); letter-spacing: 0.06em;">
          EVANGELINE
        </p>
        <h1 id="auth-title">Sign in</h1>
        <p class="lede">Username and password — stored locally in SQLite on your server.</p>
        <form id="auth-form">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required minlength="3" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              minlength="4"
            />
          </div>
          <p id="error" class="error" role="alert"></p>
          <div class="btn-row">
            <button id="submit-btn" class="btn btn-primary" type="submit">Sign in</button>
            <button id="mode-toggle" class="btn btn-ghost" type="button">
              Need an account? Register
            </button>
          </div>
        </form>
        <p style="margin-top: 1.25rem; font-size: 0.85rem;">
          <a href="/">← Back to splash</a>
        </p>
      </section>
    </main>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
